name: Official SDK + ImageBuilder Pipeline

on:
  workflow_dispatch:

env:
  RELEASE_VER: "23.05.4"
  TARGET_ARCH: "x86/64"
  TZ: Asia/Shanghai

jobs:
  build-packages:
    name: Step 1 - Compile Custom IPKs
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential ccache gawk git gettext libncurses5-dev libssl-dev zlib1g-dev xz-utils

    - name: Setup SDK & Feeds
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/${{ env.RELEASE_VER }}/targets/${{ env.TARGET_ARCH }}"
        
        # 1. 动态抓取真实的官方 SDK 文件名（避免 404）
        SDK_FILE=$(curl -sL "${BASE_URL}/sha256sums" | grep -o 'openwrt-sdk-.*\.tar\.xz' | head -n 1)
        echo "Downloading SDK: ${SDK_FILE}"
        wget "${BASE_URL}/${SDK_FILE}" -O sdk.tar.xz
        
        # 2. 解压并进入 SDK 目录
        tar -xf sdk.tar.xz
        rm -f sdk.tar.xz
        mv openwrt-sdk-* sdk
        cd sdk

        # 3. 引入你的两个依赖与插件仓库
        echo 'src-git small https://github.com/stephenchou888/small' >> feeds.conf.default
        echo 'src-git custompkgs https://github.com/stephenchou888/openwrt-packages' >> feeds.conf.default

        # 4. 更新并安装 feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Compile Selected Packages
      run: |
        cd sdk
        # 仅针对目标应用单独编译为 ipk（不编译系统内核，速度快）
        make package/luci-app-passwall/compile -j$(nproc) || make package/luci-app-passwall/compile V=s

        # 收集产出的所有 .ipk 文件
        mkdir -p $GITHUB_WORKSPACE/custom-ipks
        find bin/packages/ -name "*.ipk" -exec cp {} $GITHUB_WORKSPACE/custom-ipks/ \;

    - name: Upload IPKs Artifact
      uses: actions/upload-artifact@v4
      with:
        name: custom-ipks
        path: custom-ipks/

  pack-firmware:
    name: Step 2 - Assemble into Official OpenWrt
    needs: build-packages
    runs-on: ubuntu-22.04
    steps:
    - name: Download Custom IPKs
      uses: actions/download-artifact@v4
      with:
        name: custom-ipks
        path: custom-ipks

    - name: Setup Image Builder
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install xz-utils
        
        BASE_URL="https://downloads.openwrt.org/releases/${{ env.RELEASE_VER }}/targets/${{ env.TARGET_ARCH }}"
        
        # 动态抓取官方 Image Builder 文件名
        IB_FILE=$(curl -sL "${BASE_URL}/sha256sums" | grep -o 'openwrt-imagebuilder-.*\.tar\.xz' | head -n 1)
        echo "Downloading Image Builder: ${IB_FILE}"
        wget "${BASE_URL}/${IB_FILE}" -O ib.tar.xz
        
        tar -xf ib.tar.xz
        rm -f ib.tar.xz
        mv openwrt-imagebuilder-* ib
        cd ib

        # 将 Step 1 编译出来的所有 ipk 注入 packages 目录
        mkdir -p packages
        cp -r $GITHUB_WORKSPACE/custom-ipks/* packages/

        # 允许未签名本地包
        sed -i 's/option check_signature/# option check_signature/g' repositories.conf

        # 配置默认后台 IP 为 192.168.50.5
        mkdir -p files/etc/uci-defaults
        cat << 'EOF' > files/etc/uci-defaults/99-custom-ip
        uci set network.lan.ipaddr='192.168.50.5'
        uci commit network
        EOF

    - name: Make Image
      run: |
        cd ib
        make image PROFILE="generic" \
          PACKAGES="luci luci-base luci-compat luci-theme-argon luci-app-passwall curl wget-ssl" \
          FILES="files"

        mkdir -p $GITHUB_WORKSPACE/firmware
        cp bin/targets/x86/64/*-combined-efi.img.gz $GITHUB_WORKSPACE/firmware/ 2>/dev/null || cp bin/targets/x86/64/*-combined.img.gz $GITHUB_WORKSPACE/firmware/

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: official-sdk-${{ github.run_id }}
        files: firmware/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
